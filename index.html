<!DOCTYPE html>
<!--
  Athleten-App – die Startdatei.
  Hier steht nur das GERÜST: ein leerer Bereich für den Inhalt (#inhalt)
  und die Tab-Leiste unten. Den Inhalt jeder Ansicht baut JavaScript (Ordner js/).
-->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: nutzt auch den Bereich um die "Notch" bei iPhones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Athleten-App</title>
  <!-- Schrift "Inter" von Google Fonts – sieht der Apple-Schrift sehr ähnlich, auch auf Windows -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Hier hinein zeichnet JavaScript die aktuelle Ansicht (Heute, Aufgaben, ...) -->
  <main id="inhalt" class="inhalt"></main>

  <!-- Tab-Leiste unten, wie bei iPhone-Apps -->
  <nav class="tabbar">
    <button class="tab" data-ansicht="heute">
      <span class="tab-icon">🏠</span><span>Heute</span>
    </button>
    <button class="tab" data-ansicht="aufgaben">
      <span class="tab-icon">📝</span><span>Aufgaben</span>
      <span class="badge" id="badge-aufgaben" hidden></span>
    </button>
    <button class="tab" data-ansicht="training">
      <span class="tab-icon">🤾</span><span>Training</span>
    </button>
    <button class="tab" data-ansicht="schlaf">
      <span class="tab-icon">😴</span><span>Schlaf</span>
    </button>
    <button class="tab" data-ansicht="plan">
      <span class="tab-icon">📅</span><span>Plan</span>
    </button>
  </nav>

  <!--
    Die JavaScript-Dateien. Die Reihenfolge ist wichtig:
    Erst die Helfer, die alle anderen brauchen – ganz zum Schluss app.js, die alles startet.
  -->
  <script src="js/hilfen.js"></script>
  <script src="js/speicher.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/aufgaben.js"></script>
  <script src="js/training.js"></script>
  <script src="js/heute.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
